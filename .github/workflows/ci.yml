name: CI Pipeline

on:
  push:
    branches:
      - main
      - 'feature/*'
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  test-and-lint:
    name: Run Linting, Tests, and Security Checks
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      
      - name: Set up Python 3.11
        uses: actions/setup-python@0b93645e9fea7318ecaed2b359559ac225c90a2b # v5.3.0
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r app/requirements.txt
          pip install ruff pip-audit

      - name: Lint with Ruff
        run: ruff check app/

      - name: Security Check with pip-audit
        run: pip-audit -r app/requirements.txt || echo "Vulnerabilities found but not failing the build."

      - name: Run Tests
        run: pytest -v app/tests

  docker-build:
    name: Build Docker Image
    runs-on: ubuntu-latest
    needs: test-and-lint
    steps:
      - name: Checkout code
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      
      - name: Build Docker image
        run: docker build -t ai-log-anomaly-devops:ci .

